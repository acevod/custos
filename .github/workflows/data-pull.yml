name: Data Pull and Health Check

# Runs automatically every 4 hours, and can also be triggered
# manually from the Actions tab (useful for testing).
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

# Prevents overlapping runs from racing on the same data/*.json state
# files - queues the second run instead of running concurrently.
concurrency:
  group: custos-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    # A hung provider must not hold the shared state lock for 6 hours
    # (the default job timeout).
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fail fast before any state file is touched if a regression
      # slipped in - the decision engine runs on real state next.
      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run main.py
        env:
          QWEN_BITGET_API_KEY: ${{ secrets.QWEN_BITGET_API_KEY }}
          QWEN_BITGET_BASE_URL: ${{ secrets.QWEN_BITGET_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python main.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit if something actually changed - an empty
          # commit would fail the step and break the schedule.
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update monitoring data [automated]"
          # If someone pushed to main while this run was in flight, rebase
          # our data commit on top instead of losing the whole cycle.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push attempt ${attempt} failed - retrying"
            sleep $((attempt * 5))
          done
          echo "::error::could not push data after 3 attempts"
          exit 1
